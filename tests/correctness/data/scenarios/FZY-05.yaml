id: FZY-05
category: Fuzzy Matching
input: Summarize the average delivery time for customers in 'Rio de Janero' for orders with a 'shippd' status.
ground_truth_sql: |
  SELECT AVG(o.actual_delivery_time_days) AS average_delivery_time
  FROM fct_orders o
  JOIN dim_customers c ON o.customer_unique_id = c.customer_unique_id
  WHERE o.is_valid_order = 1
    AND EDITDISTANCE(LOWER(o.order_status), 'shipped') <= 2
    AND EDITDISTANCE(LOWER(c.customer_city), 'rio de janeiro') <= 2;
expected_output: |
  No data was found for orders with a 'shipped' status and customers in 'Rio de Janeiro'.
metadata:
  limit_type: standard_nl_limit
  intent: nl
  download_button: False
  is_capped: False
  is_editdistance: True
