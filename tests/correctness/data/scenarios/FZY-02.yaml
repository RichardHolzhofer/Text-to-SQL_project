id: FZY-02
category: Fuzzy Matching
input: List all items sold in the 'bed bath tabl' category.
ground_truth_sql: |
  SELECT 
  oi.order_id, 
  oi.product_id, 
  oi.price, 
  oi.freight_value
  FROM 
  fct_order_items oi
  WHERE 
  EDITDISTANCE(LOWER(oi.product_category), LOWER('bed bath tabl')) <= 2
  ORDER BY 
  oi.order_id;
