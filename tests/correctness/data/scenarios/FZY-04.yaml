id: FZY-04
category: Fuzzy Matching
input: Show the top 3 cities with the most orders for 'beuty' products.
ground_truth_sql: |
  SELECT o.customer_city, COUNT(*) AS order_count
  FROM fct_order_items oi
  JOIN fct_orders o ON oi.order_id = o.order_id
  WHERE LOWER(oi.product_category) ILIKE '%beauty%'
  GROUP BY o.customer_city
  ORDER BY order_count DESC
  LIMIT 3;
expected_output: |
  Here are the tabular results you requested.
  [
  {
    "CUSTOMER_CITY": "sao paulo",
    "ORDER_COUNT": 1753
  },
  {
    "CUSTOMER_CITY": "rio de janeiro",
    "ORDER_COUNT": 572
  },
  {
    "CUSTOMER_CITY": "belo horizonte",
    "ORDER_COUNT": 274
  }
  ]
