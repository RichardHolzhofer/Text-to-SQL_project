id: TAB-03
category: Standard Tab
input: List the top 5 customers by lifetime value, and include their city, state, and the total number of distinct product categories they have shopped from.
ground_truth_sql: |
  SELECT 
    c.customer_unique_id, 
    c.customer_city, 
    c.customer_state, 
    c.lifetime_value, 
    COUNT(DISTINCT oi.product_category) AS distinct_product_categories
    FROM 
    dim_customers c
    JOIN 
    fct_orders o ON c.customer_unique_id = o.customer_unique_id
    JOIN 
    fct_order_items oi ON o.order_id = oi.order_id
    GROUP BY 
    c.customer_unique_id, c.customer_city, c.customer_state, c.lifetime_value
    ORDER BY 
    c.lifetime_value DESC
    LIMIT 5;
