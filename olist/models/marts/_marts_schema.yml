version: 2

models:
  - name: dim_customers
    description: >
      Final customer dimension table at the customer_unique_id grain. 
      Provides a holistic view of customer behavior, including lifetime value (LTV), 
      loyalty status, and geographic patterns.
    columns:
      - name: customer_unique_id
        description: "Primary Key. Global unique identifier for the human customer."
        tests:
          - unique
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        description: "2-letter Brazilian state code (e.g., 'SP' for Sao Paulo, 'RJ' for Rio de Janeiro, 'MG' for Minas Gerais, 'BA' for Bahia)."
        tests:
          - not_null
      - name: customer_zip_code
        description: "Customer's zip code prefix."
        tests:
          - not_null
      - name: total_valid_orders
        description: "Total count of orders not canceled or unavailable."
        tests:
          - not_null
      - name: total_canceled_orders
        description: "Total count of canceled or unavailable orders."
        tests:
          - not_null
      - name: first_purchase_at
        description: "Timestamp of the customer's first purchase."
        tests:
          - not_null
      - name: last_purchase_at
        description: "Timestamp of the customer's most recent purchase."
      - name: is_returning_customer
        description: "Boolean flag (1/0) indicating if the customer has made more than one purchase."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: lifetime_value
        description: "Total revenue generated by this customer (sum of valid order values)."
        tests:
          - not_null
      - name: average_order_value
        description: "Average value of valid orders for this customer."
        tests:
          - not_null
      - name: recency_days
        description: "Number of days since the customer's last purchase."
        tests:
          - not_null

  - name: fct_orders
    description: >
      The primary Fact table for orders. One row per order. 
      This wide table combines financial metrics, delivery performance KPIs, 
      customer geographic context, and review sentiment.
    columns:
      - name: order_id
        description: "Primary Key. Unique identifier for the order."
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Global unique identifier for the customer."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        description: "Current status of the order (e.g., delivered, shipped, canceled)."
        tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Timestamp when the order was placed."
        tests:
          - not_null
      - name: order_approved_at
        description: "Timestamp when payment was approved."
      - name: order_delivered_carrier_date
        description: "Timestamp when order was handed to the carrier."
      - name: order_delivered_customer_date
        description: "Timestamp of actual delivery to the customer."
      - name: order_estimated_delivery_date
        description: "The delivery date promised to the customer at purchase."
      - name: total_order_value
        description: "Total value of the order including freight."
        tests:
          - not_null
      - name: credit_card_amount
        description: "Amount paid via credit card."
        tests:
          - not_null
      - name: voucher_amount
        description: "Amount paid via voucher."
        tests:
          - not_null
      - name: boleto_amount
        description: "Amount paid via boleto."
        tests:
          - not_null
      - name: has_voucher_payment
        description: "Flag (1/0) indicating if any part of the order was paid with a voucher."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: max_installments
        description: "Maximum number of installments used for payment."
      - name: review_score
        description: "Overall satisfaction score for the order."
        tests:
          - not_null
      - name: latest_review_creation_date
        description: "Date when the most recent review for this order was created."
      - name: latest_review_answer_timestamp
        description: "Timestamp when the most recent review was answered by the company."
      - name: customer_city
        description: "City of the customer at the time of the order."
        tests:
          - not_null
      - name: customer_state
        description: "State of the customer at the time of the order."
        tests:
          - not_null
      - name: is_delivered_on_time
        description: "Flag (1/0) indicating if actual delivery was on or before estimated date."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_valid_order
        description: "Flag (1/0) indicating if the order is considered valid (not canceled/unavailable)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: review_combined_text
        description: "Formatted string joining title and message for semantic vector search."
      - name: days_delayed
        description: "Number of days delivery was delayed beyond the estimate. 0 if on time."
        tests:
          - not_null
      - name: actual_delivery_time_days
        description: "Total days from purchase to delivery."
      - name: estimated_delivery_time_days
        description: "Total days from purchase to the estimated delivery date."
        tests:
          - not_null

  - name: fct_order_items
    description: >
      Detailed line-item fact table. One row per product within an order. 
      Includes product category enrichment and seller details.
    columns:
      - name: order_id
        description: "Foreign key to fct_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        description: "Sequential ID for the item within the order."
        tests:
          - not_null
      - name: product_id
        description: "Unique identifier for the product."
        tests:
          - not_null
      - name: seller_id
        description: "Unique identifier for the seller."
        tests:
          - not_null
      - name: price
        description: "The listing price of the item."
        tests:
          - not_null
      - name: freight_value
        description: "The cost of shipping for this item."
        tests:
          - not_null
      - name: product_category
        description: "Standardized English category name for the product."
        tests:
          - not_null
      - name: seller_city
        description: "City where the seller is located."
        tests:
          - not_null
      - name: seller_state
        description: "State where the seller is located."
        tests:
          - not_null
      - name: order_status
        description: "Status of the parent order."
        tests:
          - not_null
      - name: order_purchase_timestamp
        description: "Timestamp when the parent order was placed."
        tests:
          - not_null

  - name: dim_reviews
    description: >
      Feedback-focused mart table. Consolidates product and service reviews at the order level. 
      Includes a optimized text field for vector embeddings.
    columns:
      - name: order_id
        description: "Foreign key to fct_orders."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: review_score
        description: "Overall satisfaction score for the order."
        tests:
          - not_null
      - name: total_reviews_received
        description: "Total number of reviews submitted for this order."
        tests:
          - not_null
      - name: review_comment_title
        description: "The title of the review comment."
      - name: review_comment_message
        description: "The full text message of the review."
      - name: latest_review_creation_date
        description: "Creation date of the most recent review."
      - name: latest_review_answer_timestamp
        description: "Timestamp of the most recent review response."
      - name: review_combined_text
        description: "Formatted string joining title and message for semantic vector search."
      - name: review_comment_length
        description: "Length of the review comment message in characters."