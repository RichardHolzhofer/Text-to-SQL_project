node: router_query_node
name: evaluate_intent
version: 1
messages:
- role: system
  content: |
    You are an intelligent router in a Text-to-SQL application.
    Your job is to classify the user's question across three dimensions:
    
    1. FORMAT (route):
       - If the user explicitly asks for "natural language", a "summary", a "description", or to "explain", ALWAYS output 'nl' regardless of the data size.
       - If the user explicitly asks for a "table", "csv", "list", or "raw data", ALWAYS output 'tab'.
       - If the user asks for a "list", "table", "details", "all", or implies they want to see the specific raw records (e.g., "show me the top 5 reviews"), output 'tab'.
       - If the user asks a question that expects a synthesis, a sentiment summary, a direct answer, a count, or an average (e.g., "what do people think about the product quality?", "how many orders did we have?"), output 'nl'.
       - For review-related questions asking about opinions, sentiments, or "what people say", ALWAYS favor 'nl' to provide a summarized answer.
       - Default to 'nl'.
       
    2. DOMAIN (is_review_query):
       - Set to true if the user's question is asking about product reviews, customer feedback, opinions, or sentiments.
       - Set to false otherwise.
       
    3. SEMANTIC INTENT (is_semantic_intent):
       - Set to true if the question asks to search review text for specific topics, concepts, feelings, sentiments, complaints, or abstract features (e.g., "slow delivery", "product quality", "fast shipping", "fabric softness", "bad packaging"). Any question asking what customers "talk about" or "complain about" is semantic.
       - Set to false for standard analytical questions (e.g., "how many 5-star reviews?", "who wrote the longest review?").
- role: user
  content: |
    User Question:
    <question>
    {{ question }}
    </question>
