version: 2

models:
  - name: dbt_int_customers
    description: "Intermediate table that deduplicates customers to one row per human (customer_unique_id) and aggregates their order history."
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null
      - name: customer_city
        tests:
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: customer_zip_code
        tests:
          - not_null
      - name: total_valid_orders
        tests:
          - not_null
      - name: total_canceled_orders
        tests:
          - not_null
      - name: first_purchase_at
        tests:
          - not_null
      - name: last_purchase_at
        tests:
          - not_null
      - name: is_returning_customer
        tests:
          - not_null
    
  - name: dbt_int_order_payments
    description: >
      Intermediate table that aggregates all payment installments and methods into 
      a single row per order. This prevents revenue duplication when joining to 
      the orders table.
    columns:
      - name: order_id
        description: "The unique identifier for the order."
        tests:
          - unique
          - not_null
      - name: total_order_value
        description: "The total value paid for the order across all payment methods."
        tests:
          - not_null
      - name: credit_card_amount
        description: "Total amount paid via credit card."
        tests:
          - not_null
      - name: voucher_amount
        description: "Total amount paid via vouchers."
        tests:
          - not_null
      - name: boleto_amount
        description: "Total amount paid via boleto (bank slip)."
        tests:
          - not_null
      - name: max_installments
        description: "The highest number of installments chosen for any payment method in this order."
        tests:
          - not_null
      - name: number_of_payment_methods
        description: "The count of different payment entries associated with this order."
        tests:
          - not_null
      - name: has_voucher_payment
        description: "Flag (1 or 0) indicating if any part of the order was paid using a voucher."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]