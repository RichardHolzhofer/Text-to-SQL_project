name: Model Correctness Evaluation

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the evaluation'
        required: false
        type: string
        default: 'Manual accuracy check'

jobs:
  evaluate:
    name: DeepEval Correctness Suite
    runs-on: ubuntu-latest
    
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.DBT_SNOWFLAKE_DATABASE }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.DBT_SNOWFLAKE_WAREHOUSE }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}
      AGENT_SNOWFLAKE_ROLE: ${{ secrets.AGENT_SNOWFLAKE_ROLE }}
      DBT_SNOWFLAKE_SCHEMA: ${{ secrets.DBT_SNOWFLAKE_SCHEMA }}
      AGENT_SNOWFLAKE_SCHEMA: ${{ secrets.AGENT_SNOWFLAKE_SCHEMA }}
      DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
      AGENT_SNOWFLAKE_USER: ${{ secrets.AGENT_SNOWFLAKE_USER }}
      AGENT_SNOWFLAKE_PASSWORD: ${{ secrets.AGENT_SNOWFLAKE_PASSWORD }}
      SUPABASE_PROJECT_NAME: ${{ secrets.SUPABASE_PROJECT_NAME }}
      SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      SMART_LLM_MODEL: ${{ secrets.SMART_LLM_MODEL }}
      FAST_LLM_MODEL: ${{ secrets.FAST_LLM_MODEL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Correctness Eval Tests (DeepEval)
        run: uv run deepeval test run tests/correctness/test_correctness.py
